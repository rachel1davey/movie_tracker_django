{% extends "base.html" %}
{% block title %}Edit Review{% endblock %}
{% block content %}
    <div class="min-h-[60vh] flex items-center justify-center">
        <section class="w-full max-w-md bg-white text-black p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-semibold text-center mb-4">Edit Your Review</h2>
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="flex gap-3 justify-center">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'movies:movie_detail' review.movie_id %}" class="btn btn-ghost">Cancel</a>
                </div>
            </form>
        </section>
    </div>
{% endblock %}
