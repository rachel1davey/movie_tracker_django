{% extends "base.html" %}
{% load static %}

{% block title %}Confirm Delete Account{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="card bg-base-100 shadow-md p-6">
    <h2 class="text-xl font-semibold mb-4">Confirm account deletion</h2>
    <p class="mb-4">Are you sure you want to delete your account? This action cannot be undone.</p>
    <form method="POST" action="{% url 'core:delete_account' %}">
      {% csrf_token %}
      <div class="flex gap-3">
        <button type="submit" class="btn btn-error">Yes, delete my account</button>
        <a href="{% url 'core:profile_settings' %}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
